name: Build Android APK (WebView)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          mkdir -p mobile-app
          cd mobile-app
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          
          # Create dummy web directory
          mkdir -p www
          echo "<html><head><meta http-equiv=\"refresh\" content=\"0; URL='https://www.kurslarim.uz'\" /></head><body></body></html>" > www/index.html
          
          # Initialize Capacitor
          npx cap init Kurslarim uz.kurslarim.app --web-dir www
          
          # Configure Capacitor for External URL
          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'uz.kurslarim.app',
            appName: 'Kurslarim',
            webDir: 'www',
            bundledWebRuntime: false,
            server: {
              url: 'https://www.kurslarim.uz',
              cleartext: true
            }
          };

          export default config;
          EOF
          
          # Add Android platform
          npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurslarim-App
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
